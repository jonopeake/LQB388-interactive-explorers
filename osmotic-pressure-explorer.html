<!doctype html>
<html lang="en-AU">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Osmotic pressure explorer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5f8;color:#18374b;font:16px/1.5 system-ui,sans-serif}main{max-width:980px;margin:12px auto;padding:clamp(14px,3vw,26px);background:white;border:1px solid #cfdee6;border-radius:16px}h1{margin:0;font-size:clamp(1.5rem,4vw,2rem)}p{margin:8px 0}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:14px}.card{min-width:0;background:#f2f8fa;border:1px solid #cfdee6;border-radius:12px;padding:14px}svg{width:100%;height:auto;display:block;background:white;border-radius:9px}label,output{font-weight:700}input[type=range]{width:100%;accent-color:#096b81;margin:8px 0 16px}:focus-visible{outline:3px solid #9c5700;outline-offset:3px}.result{border-left:4px solid #096b81;padding:8px 10px;margin-top:10px;background:white}small{color:#425f70}@media(max-width:690px){.grid{grid-template-columns:1fr}main{margin:5px}}
</style>
<main>
<h1>Osmotic pressure</h1>
<p>Change the glucose concentration on either side of the membrane. Which way does water move?</p>
<div class="grid">
<section class="card" aria-label="Water movement across the membrane">
<svg viewBox="0 0 480 245" role="img" aria-labelledby="comparison-title" font-family="system-ui,sans-serif">
<title id="comparison-title">Osmotic pressure comparison</title>
<rect x="20" y="10" width="220" height="195" fill="#d7eff9"/>
<rect x="240" y="10" width="220" height="195" fill="#d7eff9"/>
<path d="M240 10V205" stroke="#277486" stroke-width="5" stroke-dasharray="5 4"/>
<g text-anchor="middle" fill="#18374b">
<text x="130" y="35" font-size="17">Left solution</text>
<text x="350" y="35" font-size="17">Right solution</text>
<text id="left-pressure" x="130" y="60" font-size="15"></text>
<text id="right-pressure" x="350" y="60" font-size="15"></text>
<text id="comparison-label" x="240" y="180" font-size="15" font-weight="700"></text>
<text x="240" y="228" font-size="15">Membrane permeable to water only</text>
</g>
<g id="comparison-dots" fill="#a84560"></g>
<path id="comparison-arrow" fill="#076d86"/>
</svg>
<p class="result" role="status" id="comparison-result"></p>
</section>
<section class="card" aria-label="Concentration controls">
<label for="left-glucose">Left glucose concentration</label> <output id="left-value" for="left-glucose"></output>
<input id="left-glucose" type="range" min="0" max="200" step="25" value="50">
<label for="right-glucose">Right glucose concentration</label> <output id="right-value" for="right-glucose"></output>
<input id="right-glucose" type="range" min="0" max="200" step="25" value="150">
<p><strong id="pressure-difference"></strong></p>
<p><small>Hydrostatic pressure is equal on both sides. The purple dots represent glucose, which stays on its own side. The arrow shows the initial net direction of water movement.</small></p>
</section>
</div>
</main>
<script>
const get = id => document.getElementById(id);
const pressureAt = concentration => Math.round(concentration * 8.314 * 310.15 / 1000);
const leftControl = get('left-glucose');
const rightControl = get('right-glucose');
function compare() {
  const left = Number(leftControl.value);
  const right = Number(rightControl.value);
  const leftPressure = pressureAt(left);
  const rightPressure = pressureAt(right);
  get('left-value').textContent = left + ' mmol/L';
  get('right-value').textContent = right + ' mmol/L';
  get('left-pressure').textContent = 'Osmotic pressure: ' + leftPressure + ' kPa';
  get('right-pressure').textContent = 'Osmotic pressure: ' + rightPressure + ' kPa';
  get('pressure-difference').textContent = 'Osmotic pressure difference: ' + pressureAt(Math.abs(right-left)) + ' kPa';
  const dots = [];
  for (const [amount, offset] of [[left, 0], [right, 220]]) {
    for (let i = 0; i < amount / 5; i++) {
      const slot = i * 13 % 40;
      dots.push('<circle cx="' + (42 + offset + slot % 10 * 19) + '" cy="' + (79 + Math.floor(slot / 10) * 14) + '" r="3.5"/>');
    }
  }
  get('comparison-dots').innerHTML = dots.join('');
  const direction = Math.sign(right-left);
  const length = 22 + Math.abs(right-left) * 0.7;
  const start = 240 - direction * length / 2;
  const tip = 240 + direction * length / 2;
  const head = tip - direction * 11;
  get('comparison-arrow').setAttribute('d', direction ? 'M'+start+' 143H'+head+'v-5L'+tip+' 147L'+head+' 156v-5H'+start+'Z' : '');
  const side = direction > 0 ? 'right' : 'left';
  const label = direction ? 'Net water flow to the ' + side : 'No net water flow';
  get('comparison-label').textContent = label;
  get('comparison-title').textContent = label;
  get('comparison-result').textContent = direction
    ? 'The ' + side + ' side has more glucose per litre and a higher osmotic pressure. At equal hydrostatic pressure, net water movement is towards that side.'
    : 'The concentrations and osmotic pressures are equal. Water crosses in both directions at equal rates.';
}
leftControl.addEventListener('input', compare);
rightControl.addEventListener('input', compare);
compare();
</script>
</html>
